name: Quality

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Node regression tests
        run: npm test
      - name: Type declarations
        run: npm run typecheck
      - name: Build distributable
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser lifecycle tests
        run: npm run test:browser

  # One-time branch retirement; remove after master verification.
  retire_merged_main:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm all main commits are in master and delete main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin main >/dev/null; then
            echo "main no longer exists"
            exit 0
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor refs/remotes/origin/main "$GITHUB_SHA"; then
            echo "::error::Refusing to delete main: main is not contained in master"
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/main"
          echo "Deleted main after verifying fast-forward ancestry"
